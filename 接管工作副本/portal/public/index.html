<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161A" media="(prefers-color-scheme: dark)">
<title>于百万 · 工作台</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo">于</div>
      <div>
        <div class="brand-name">于百万</div>
        <div class="brand-sub">炸串拌面</div>
      </div>
    </div>
    <div class="top-right">
      <div class="status-pill"><span class="dot"></span>统一身份已连接</div>
      <div class="userbox" id="userbox" hidden>
        <div class="user-meta">
          <div class="user-name" id="userName">—</div>
          <div class="user-role" id="userRole">—</div>
        </div>
        <button class="logout" id="btnLogout" type="button">退出</button>
      </div>
    </div>
  </div>
</header>

<main class="stage">
  <div class="loading" id="loading">正在验证身份…</div>

  <section class="login-wrap" id="loginPanel" hidden>
    <div class="login-card">
      <div class="login-badge">
        <div class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/><circle cx="12" cy="15.5" r="1.4"/></svg></div>
      </div>
      <div class="login-brand">于百万 · 炸串拌面</div>
      <h1>登录工作台</h1>
      <p class="login-sub">一个账号，全部工具通用</p>
      <p class="login-slogan">生意做遍，不如卖面</p>
      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="username">账号</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号" required>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
        </div>
        <button class="btn-login" id="btnLogin" type="submit">登录</button>
        <div class="err" id="loginErr" role="alert" aria-live="polite"></div>
      </form>
      <div class="login-tip">登录后可直接进入有权限使用的工具<br>账号由管理员统一分配</div>
    </div>
  </section>

  <section class="tools-wrap" id="toolsPanel" hidden>
    <div class="sec-head">
      <div class="eyebrow">Select Tool</div>
      <h1>选择要使用的工具</h1>
      <p class="sec-sub" id="welcome">—</p>
    </div>
    <div class="cards" id="cards"></div>
    <div class="foot" id="foot">于百万 · 炸串拌面 · 内部工作台</div>
  </section>
</main>

<script>
var ICONS = {
  qsc: '<svg viewBox="0 0 24 24"><path d="M9 4.5h6a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v0a2 2 0 0 1 2-2z"/><path d="M5 6.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.5"/><path d="M8.5 13l2.2 2.2L15.5 10"/></svg>',
  data: '<svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 20v-6"/><path d="M12 20v-11"/><path d="M17 20v-8"/><path d="M6 9l4-4 3 3 5-5"/></svg>',
  account: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="16.8" cy="9.2" r="2.4"/><path d="M20.5 19c0-2.4-1.6-4-3.9-4"/></svg>'
};

/* 工具身份色：只用于图标与顶部细条，底色由 CSS 与表面色混合，暗色模式自动适配 */
var THEME = {
  qsc: '#0E9E70',
  data: '#E2662F',
  account: '#6B4FE0'
};

var TOOLS = [
  {
    id: 'qsc',
    title: 'QSC 厨房清洁',
    desc: '门店卫生检查、现场拍照、整改跟踪与超管看板。',
    href: 'https://qsc.sangyu.work/',
    superOnly: false
  },
  {
    id: 'data',
    title: '数据追踪',
    desc: '三平台营收汇总、目标进度、缺口分析与通晒海报。',
    href: 'https://data.sangyu.work/',
    superOnly: false
  },
  {
    id: 'account',
    title: '账号系统',
    desc: '账号新增、修改、停用与门店归属管理。',
    href: '/account',
    superOnly: true
  }
];

var ROLE_LABEL = { super_admin: '项目负责人', manager: '店长', employee: '店员' };
var STORE_LABEL = { dyz: '大悦城店', rt: '日坛店', jz: '金盏店', wj: '望京店' };

var visibleTools = [];

function el(id) { return document.getElementById(id); }

function show(node, on) {
  if (!node) return;
  node.hidden = !on;
}

function roleText(u) {
  var r = ROLE_LABEL[u.role] || u.role || '';
  var s = u.store_code ? STORE_LABEL[u.store_code] || u.store_code : '';
  return s ? (r + ' · ' + s) : r;
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function renderCards(u) {
  visibleTools = TOOLS.filter(function (t) {
    return !t.superOnly || u.role === 'super_admin';
  });
  el('cards').innerHTML = visibleTools.map(function (t, i) {
    var c = THEME[t.id] || THEME.qsc;
    return '<a class="card" href="' + t.href + '" style="--i:' + i + ';--c:' + c + '">' +
      '<span class="card-no">' + pad(i + 1) + '</span>' +
      '<div class="card-ico">' + ICONS[t.id] + '</div>' +
      '<h3>' + t.title + '</h3>' +
      '<p>' + t.desc + '</p>' +
      '<div class="card-foot">' +
        '<span class="card-go">进入工具 <svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg></span>' +
        '<span class="card-tag"><i></i>已就绪</span>' +
      '</div>' +
      '</a>';
  }).join('');

  el('foot').textContent = visibleTools.length > 1
    ? '按 1 – ' + visibleTools.length + ' 可直接打开对应工具'
    : '于百万 · 炸串拌面 · 内部工作台';

  bindSpotlight();
}

/* 光标柔光：只更新两个 CSS 变量，位置计算交给合成层，滚动时也不掉帧 */
function bindSpotlight() {
  var box = el('cards');
  if (!box || box._spot) return;
  box._spot = true;
  box.addEventListener('pointermove', function (e) {
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (!card) return;
    var r = card.getBoundingClientRect();
    card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    card.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
}

function renderLoggedIn(u) {
  show(el('loading'), false);
  show(el('loginPanel'), false);
  show(el('toolsPanel'), true);
  show(el('userbox'), true);
  el('userName').textContent = u.real_name || u.username;
  el('userRole').textContent = roleText(u);
  el('welcome').textContent = '欢迎，' + (u.real_name || u.username) + '　登录一次，全部工具通用';
  renderCards(u);
}

function renderLogin() {
  show(el('loading'), false);
  show(el('toolsPanel'), false);
  show(el('loginPanel'), true);
  show(el('userbox'), false);
  visibleTools = [];
  setTimeout(function () { try { el('username').focus(); } catch (e) {} }, 150);
}

/* 工具台数字快捷键：1/2/3 直接跳转。输入框内不拦截，避免影响正常打字。 */
document.addEventListener('keydown', function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  var n = parseInt(e.key, 10);
  if (!n || n < 1 || n > visibleTools.length) return;
  e.preventDefault();
  location.href = visibleTools[n - 1].href;
});

function boot() {
  fetch('/api/me', { credentials: 'same-origin' })
    .then(function (r) {
      if (!r.ok) { renderLogin(); return null; }
      return r.json();
    })
    .then(function (j) {
      if (j && j.ok) renderLoggedIn(j);
      else renderLogin();
    })
    .catch(function () { renderLogin(); });
}

el('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var username = el('username').value.trim();
  var password = el('password').value;
  var btn = el('btnLogin');
  el('loginErr').textContent = '';
  if (!username || !password) { el('loginErr').textContent = '请输入账号和密码'; return; }
  btn.disabled = true;
  btn.textContent = '验证身份中…';
  fetch('/api/login', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username, password: password })
  })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j && j.ok) {
        renderLoggedIn(j);
      } else {
        el('loginErr').textContent = (j && j.error) || '登录失败';
      }
    })
    .catch(function () { el('loginErr').textContent = '网络异常，请重试'; })
    .then(function () {
      btn.disabled = false;
      btn.textContent = '登录';
    });
});

el('btnLogout').addEventListener('click', function () {
  fetch('/api/logout', { method: 'POST', credentials: 'same-origin' })
    .catch(function () {})
    .then(function () {
      el('username').value = '';
      el('password').value = '';
      el('loginErr').textContent = '';
      renderLogin();
    });
});

boot();
</script>
</body>
</html>
